name: Build Sony Photo File Manager (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File Self-Contained exe
        run: dotnet publish SonyPhotoFileManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./release-win-x64

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyPhotoFileManager-Windows-x64
          path: ./release-win-x64/SonyPhotoFileManager.exe
